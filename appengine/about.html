<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="google" value="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre Blockly Games</title>
  <link rel="stylesheet" href="common/common.css">
  <style>
body {
  margin: 0;
  color: #202124;
  background: #fff;
  font-family: Roboto, Arial, Helvetica, sans-serif;
}

main {
  max-width: 980px;
  margin: 0 auto;
  padding: 32px 24px 48px;
}

a {
  color: #1967d2;
}

.topbar {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  margin-bottom: 20px;
}

.lang {
  white-space: nowrap;
}

.lang a {
  margin-left: 10px;
}

h1 {
  margin: 0 0 12px;
  font-family: 'Google Sans', Roboto, Arial, Helvetica, sans-serif;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 500;
  line-height: 1.1;
}

.intro {
  max-width: 760px;
  margin: 0 0 28px;
  color: #3c4043;
  font-size: 1.15rem;
  line-height: 1.55;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  margin: 28px 0 34px;
}

.game {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 14px;
  align-items: start;
  min-height: 100px;
  padding: 16px;
  border: 1px solid #dadce0;
  border-radius: 8px;
  background: #fff;
}

.game img {
  width: 72px;
  height: 72px;
}

.game h2 {
  margin: 0 0 6px;
  font-family: 'Google Sans', Roboto, Arial, Helvetica, sans-serif;
  font-size: 1.15rem;
  font-weight: 500;
}

.game p {
  margin: 0;
  color: #5f6368;
  line-height: 1.45;
}

.info {
  max-width: 780px;
  color: #3c4043;
  line-height: 1.6;
}

footer {
  border-top: 1px solid #e8eaed;
  color: #5f6368;
  font-size: 0.95rem;
  padding: 24px 0 0;
}

footer a {
  margin-right: 16px;
}

@media (max-width: 560px) {
  main {
    padding: 24px 16px 36px;
  }

  .topbar {
    display: block;
  }

  .lang {
    margin-top: 12px;
  }

  .game {
    grid-template-columns: 56px 1fr;
    padding: 14px;
  }

  .game img {
    width: 56px;
    height: 56px;
  }
}
  </style>
</head>
<body>
<main>
  <div class="topbar">
    <a id="back" href="index.html?lang=ca">Torna a Blockly Games</a>
    <nav class="lang" aria-label="Idioma">
      <a href="about.html?lang=ca">CA</a>
      <a href="about.html?lang=es">ES</a>
    </nav>
  </div>

  <h1 id="title">Sobre Blockly Games</h1>
  <p class="intro" id="intro">Blockly Games és una col·lecció de jocs educatius
  per iniciar l'alumnat en la programació.</p>

  <section class="games" id="games" aria-label="Jocs disponibles"></section>

  <section class="info">
    <p id="info1"></p>
    <p id="info2"></p>
  </section>

  <footer>
    <a id="repoLink" href="https://github.com/sasogu/blockly-games">Codi d'Edutictac</a>
    <a id="upstreamSiteLink" href="https://blockly.games/">Blockly Games original</a>
    <a id="upstreamRepoLink" href="https://github.com/google/blockly-games">Repositori original</a>
  </footer>
</main>

<script>
const translations = {
  ca: {
    htmlLang: 'ca',
    title: 'Sobre Blockly Games',
    back: 'Torna a Blockly Games',
    gamesLabel: 'Jocs disponibles',
    intro: 'Blockly Games és una col·lecció de jocs educatius per iniciar l\'alumnat en la programació. Els reptes comencen amb blocs visuals i avancen gradualment cap a idees com els bucles, les condicions, les funcions i el codi JavaScript.',
    info1: 'Aquesta versió està mantinguda per Edutictac i es publica com a recurs educatiu obert. El projecte parteix de Blockly Games, creat per Google, i conserva el seu enfocament d\'aprenentatge autònom i progressiu.',
    info2: 'El codi d\'aquest desplegament és obert i es pot consultar al repositori d\'Edutictac. El projecte original continua disponible al web de Blockly Games.',
    repoLink: 'Codi d\'Edutictac',
    upstreamSiteLink: 'Blockly Games original',
    upstreamRepoLink: 'Repositori original',
    games: [
      ['dance', 'Robot Bailarín', 'Programa una coreografia amb passos de ball i seqüències.'],
      ['puzzle', 'Trencaclosques', 'Una primera presa de contacte amb les formes i encaixos dels blocs.'],
      ['maze', 'Laberint', 'Introdueix bucles i condicions amb reptes progressius.'],
      ['bird', 'Ocell', 'Treballa condicions cada vegada més precises per guiar l\'ocell.'],
      ['turtle', 'Tortuga', 'Explora bucles niats dibuixant formes i patrons.'],
      ['movie', 'Pel·lícula', 'Fes servir expressions matemàtiques per animar una escena.'],
      ['music', 'Música', 'Aprèn a crear funcions mentre compones fragments musicals.'],
      ['pond-tutor', 'Estany: tutor', 'Passa dels blocs al JavaScript amb exercicis guiats.'],
      ['pond-duck', 'Estany', 'Programa l\'ànec perquè resolga un repte obert amb blocs o codi.'],
    ],
  },
  es: {
    htmlLang: 'es',
    title: 'Sobre Blockly Games',
    back: 'Volver a Blockly Games',
    gamesLabel: 'Juegos disponibles',
    intro: 'Blockly Games es una colección de juegos educativos para iniciar al alumnado en la programación. Los retos empiezan con bloques visuales y avanzan gradualmente hacia ideas como los bucles, las condiciones, las funciones y el código JavaScript.',
    info1: 'Esta versión está mantenida por Edutictac y se publica como recurso educativo abierto. El proyecto parte de Blockly Games, creado por Google, y conserva su enfoque de aprendizaje autónomo y progresivo.',
    info2: 'El código de este despliegue es abierto y se puede consultar en el repositorio de Edutictac. El proyecto original sigue disponible en la web de Blockly Games.',
    repoLink: 'Código de Edutictac',
    upstreamSiteLink: 'Blockly Games original',
    upstreamRepoLink: 'Repositorio original',
    games: [
      ['dance', 'Robot Bailarín', 'Programa una coreografía con pasos de baile y secuencias.'],
      ['puzzle', 'Puzzle', 'Una primera toma de contacto con las formas y encajes de los bloques.'],
      ['maze', 'Laberinto', 'Introduce bucles y condiciones con retos progresivos.'],
      ['bird', 'Pájaro', 'Trabaja condiciones cada vez más precisas para guiar al pájaro.'],
      ['turtle', 'Tortuga', 'Explora bucles anidados dibujando formas y patrones.'],
      ['movie', 'Película', 'Usa expresiones matemáticas para animar una escena.'],
      ['music', 'Música', 'Aprende a crear funciones mientras compones fragmentos musicales.'],
      ['pond-tutor', 'Estanque: tutor', 'Pasa de los bloques a JavaScript con ejercicios guiados.'],
      ['pond-duck', 'Estanque', 'Programa el pato para resolver un reto abierto con bloques o código.'],
    ],
  },
};

const params = new URLSearchParams(location.search);
const lang = translations[params.get('lang')] ? params.get('lang') : 'ca';
const t = translations[lang];

document.documentElement.lang = t.htmlLang;
document.title = t.title;
document.getElementById('title').textContent = t.title;
document.getElementById('back').textContent = t.back;
document.getElementById('back').href = `index.html?lang=${lang}`;
document.getElementById('intro').textContent = t.intro;
document.getElementById('info1').textContent = t.info1;
document.getElementById('info2').textContent = t.info2;
document.getElementById('repoLink').textContent = t.repoLink;
document.getElementById('upstreamSiteLink').textContent = t.upstreamSiteLink;
document.getElementById('upstreamRepoLink').textContent = t.upstreamRepoLink;
document.getElementById('games').setAttribute('aria-label', t.gamesLabel);

document.getElementById('games').replaceChildren(...t.games.map(([id, title, description]) => {
  const article = document.createElement('article');
  const href = `${id}.html?lang=${lang}`;
  article.className = 'game';
  article.innerHTML = `
    <a href="${href}"><img src="index/${id}.png" alt=""></a>
    <div>
      <h2><a href="${href}"></a></h2>
      <p></p>
    </div>`;
  article.querySelector('h2 a').textContent = title;
  article.querySelector('p').textContent = description;
  return article;
}));
</script>
<script src="common/back.js"></script>
</body>
</html>
